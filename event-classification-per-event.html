<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Classification App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 1000px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    select, input[type=text], button, textarea { font-size: 14px; }
    select { width: 100%; padding: 5px; }
    .hidden { display: none; }
    .inline { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: nowrap; }
    .disabled { color: grey; pointer-events: none; opacity: 0.6; }
    .small-plus { font-size: 0.85em; padding: 2px 8px; margin-left: 4px; }

    .class-label {
        padding: 4px 8px;
        border-radius: 4px;
        font-weight: bold;
        display: inline-block;
        margin-top: 6px;
    }

    .major-true-positive { background: #bddec4; color: #0e8029; }
    .major-false-positive { background: #fff1c7; color: #f57f17; }
    .major-true-negative, .intermediary-empty { background: #beeef7; color: #008ba3; }
    .major-false-negative, .intermediary-missed-detection { background: #fbe9e7; color: #bf360c; }
    .major-discard, .intermediary-discard { background: #e2e3e5; color: #383d41; }
    .major-unknown, .intermediary-unknown { background: #eeeeee; color: #333; }
    .intermediary-in-bed-detection { background: #bddec4; color: #0e8029; }
    .intermediary-out-of-bed-detection { background: #ede7f6; color: #4527a0; }
    .intermediary-happy-accident { background: #fff3cd; color: #856404; }
    .intermediary-ghost { background: #fff1c7; color: #f57f17; }
    .intermediary-non-visible-intrusion { background: #f5e7f6; color: #9e27a0; }
    .intermediary-out-of-bed-presence { background: #e0f7fa; color: #006064; }

    /* Dropdown styles for multi-checkbox */
    .dropdown {
        position: relative;
        margin-top: 6px;
        user-select: none;
        width: 50%;
    }

    .dropdown-btn {
        width: 100%;
        padding: 5px;
        font-size: 14px;
        font-family: inherit;
        background-color: white;
        border: 1px solid #ccc;
        border-radius: 4px;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D'http%3A//www.w3.org/2000/svg'%20width%3D'8'%20height%3D'5'%3E%3Cpath%20fill%3D'%23666'%20d%3D'M0%200l4%205%204-5z'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 8px 5px;
        cursor: pointer;
    }

    .dropdown-btn:hover {
        border-color: #888;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #fff;
        border: 1px solid #ccc;
        max-height: 180px;
        overflow-y: auto;
        box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        border-radius: 0 0 4px 4px;
        z-index: 100;
        margin-top: 0;
        padding-top: 2px;
        width: 100%;
    }

    .dropdown-content label {
        display: block;
        padding: 6px 10px;
        cursor: pointer;
    }

    .dropdown-content label:hover {
        background-color: #f0f0f0;
    }

    .dropdown-content .dropdown-item {
        padding: 6px 10px;
        cursor: pointer;
    }

    .dropdown-content .dropdown-item:hover {
        background-color: #f0f0f0;
    }

    .env-btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
    }

    .env-btn {
        padding: 5px 10px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f5f5f5;
        cursor: pointer;
        white-space: nowrap;
    }

    .env-btn:hover {
        border-color: #888;
        background: #e8e8e8;
    }

    .env-btn.selected {
        background: #0078d4;
        color: white;
        border-color: #0078d4;
    }

    .env-row-label {
        font-size: 11px;
        font-weight: normal;
        color: #666;
        margin-top: 6px;
        margin-bottom: 2px;
        display: block;
    }

    .dropdown:hover .dropdown-content {
        display: block;
    }
    </style>

</head>
<body>

<h2>Event Classification</h2>

<textarea id="eventIdsInput" rows="3" style="width:100%;" placeholder='{"event_id": {"$in": ["uuid1", "uuid2", ...]}}'></textarea>
<br />
<button id="loadEventsBtn" style="margin-top:10px;">Load Events</button>

<div id="globalEventTypeWrapper" class="hidden">
  <label>Global Event Type *</label>
  <select id="globalEventTypeSelect">
    <option value="">-- Select --</option>
    <option value="INTRUSION">INTRUSION</option>
    <option value="LEARNING">LEARNING</option>
  </select>
</div>

<div id="inferenceDisplay" class="hidden" style="margin-top: 10px; font-weight: bold; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
  <span id="eventIdDisplay"></span>
  <span>Major: <span id="majorClass">–</span></span>
  <span>Intermediary: <span id="intermediaryClass">–</span></span>
</div>

<div id="formContainer" style="margin-top: 20px;"></div>

<div id="eventNavigator" class="hidden" style="margin: 15px 0;">
  <button id="prevEventBtn">Previous Event</button>
  <button id="nextEventBtn">Next Event</button>

  <details id="shiftPanel" style="margin-top: 12px; border: 1px solid #ccc; border-radius: 4px; padding: 8px;">
    <summary style="cursor: pointer; font-weight: bold;">Fix offset (bulk shift annotations)</summary>
    <p style="font-size: 13px; margin: 8px 0;">
      Navigate to the first event where the annotations went wrong, then shift it and every annotated event after it.<br />
      Branch event: <strong id="shiftBranchLabel"></strong>
    </p>
    <label style="margin-top: 0; font-weight: normal;">
      Through event #
      <input type="number" id="shiftEndInput" min="1" style="width: 90px;" placeholder="last annotated" />
    </label>
    <div style="margin-top: 8px;">
      <button id="shiftPrevBtn">Annotations belong to PREVIOUS event id</button>
      <button id="shiftNextBtn">Annotations belong to NEXT event id</button>
      <button id="shiftUndoBtn" disabled>Undo last shift</button>
    </div>
  </details>
</div>

<button id="exportCsvBtn" style="margin-top: 10px;">Export CSV</button>
<button id="clearSavedBtn" style="margin-top: 10px; margin-left: 10px; background: #dc3545; color: white; border: none; padding: 8px 12px; cursor: pointer;">Clear Saved Data</button>
<div id="savedIndicator" style="margin-top: 8px; color: #28a745; font-size: 12px;"></div>

<script>
let eventIds = [], currentIndex = 0;
let eventData = {};

const STORAGE_KEY = 'eventClassificationData';

function saveToLocalStorage() {
  const state = {
    eventIds,
    currentIndex,
    eventData,
    globalEventType: document.getElementById('globalEventTypeSelect')?.value || ''
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const indicator = document.getElementById('savedIndicator');
    if (indicator) {
      indicator.textContent = `Auto-saved at ${new Date().toLocaleTimeString()} (${Object.keys(eventData).length} events)`;
    }
  } catch (e) {
    console.error('Failed to save to localStorage:', e);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      if (state.eventIds && state.eventIds.length > 0) {
        return state;
      }
    }
  } catch (e) {
    console.error('Failed to load from localStorage:', e);
  }
  return null;
}

function clearLocalStorage() {
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('savedIndicator').textContent = 'Saved data cleared.';
}

const conditionalDropdowns = {
  'person_in_image==true && person_intruding==false': {
    'body_position': ['interacting with vehicle', 'within reach distance', 'outside reach distance']
  },
  'body_position==interacting with vehicle': {
    'interaction_type': ['interaction with tailgate', 'hand / arm on bed wall', 'lean against bed wall', 'interaction with overhanging object']
  },
  'person_intruding==true': {
    'body_part_in_bed': ['fingertips', 'hand / arm', 'leg / foot', 'whole body'],
    'intruding_from': ['open tailgate', 'over bed wall', 'already inside']
  },
  'person_visible_in_zone==false && person_intruding==true': {
    'person_obstructed_by': ['tonneau cover', 'bed contents', 'low light']
  },
  'person_in_bbox==false': {
    'fp_cause': [ 'non-human object', 'windscreen: raindrops', 'windscreen: soap', 
    'low light', 'shadow/reflection', 'extrapolated person', 'pet / animal'
  ]
},
  'major==false negative': {
    'fn_cause': ['small overlap', 'low light', 'TDL threshold not met', 'other']
  }
};

const requiredDropdowns = {
  environment: [
    'outside, car park', 'outside, residential', 'outside, industrial', 'outside, street parking', 'outside, rural',
    'inside, car park', 'inside, residential', 'inside, industrial',
    'unknown, low light'
  ]
};

const optionalDropdowns = {
  // Ordered by frequency of selection across the last 3 LEARNING CSVs
  // (2026_06_07, 2026_05_05, 2025_06_30) as of 2026-07-01. Unused options
  // are appended alphabetically at the end.
  non_person_movement: [
    'tree in wind',
    'car driveby',
    'raining',
    'thunderstorm',
    'flag in wind',
    'soft tonneau cover in wind',
    'garage door opening / closing',
    'tarp in wind',
    'moving bed contents',
    'pet / animal',
    'streaming water (car wash)',
    'signpost in wind',
    'motorcycle / bicycle driveby',
    'streaming water (drainpipe)'
  ]
};

const discardCriteria = [
  'incorrectly mounted', 'incorrect zone', 'open sliding window', 'obstructed (partial)',
  'obstructed (full)', 'extreme low light', 'pre- direct intrusion', 'already annotated'
];

// Utility: Create a multi-checkbox dropdown like your example inside the form
function makeMultiCheckboxDropdown(id, label, options, selectedValues = [], isAddable = false) {
  const container = document.createElement('div');
  container.style.marginTop = '12px';

  const lbl = document.createElement('label');
  lbl.textContent = label;
  container.appendChild(lbl);

  const dropdown = document.createElement('div');
  dropdown.className = 'dropdown';

  const btn = document.createElement('div');
  btn.className = 'dropdown-btn';
  btn.tabIndex = 0;
  updateButtonText();

  const dropdownContent = document.createElement('div');
  dropdownContent.className = 'dropdown-content';

  options.forEach(opt => {
    const labelEl = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.value = opt;
    checkbox.checked = selectedValues.includes(opt);

    checkbox.addEventListener('change', () => {
      const checkedVals = Array.from(dropdownContent.querySelectorAll('input[type=checkbox]:checked'))
        .map(cb => cb.value);
      eventData[eventIds[currentIndex]][id] = checkedVals;
      updateButtonText();
      saveToLocalStorage();
    });

    labelEl.appendChild(checkbox);
    labelEl.appendChild(document.createTextNode(' ' + opt));
    dropdownContent.appendChild(labelEl);
  });

  dropdown.appendChild(btn);
  dropdown.appendChild(dropdownContent);
  container.appendChild(dropdown);

  if (isAddable) {
    const addBtn = document.createElement('button');
    addBtn.className = 'small-plus';
    addBtn.textContent = '+';
    addBtn.type = 'button';
    addBtn.onclick = () => {
      if (inlineInput.style.display === 'inline') {
        inlineInput.style.display = 'none';
        return;
      }
      inlineInput.value = '';
      inlineInput.style.display = 'inline';
      inlineInput.focus();
    };

    const inlineInput = document.createElement('input');
    inlineInput.type = 'text';
    inlineInput.placeholder = 'New option…';
    inlineInput.style.display = 'none';
    inlineInput.style.fontSize = '13px';
    inlineInput.style.padding = '3px 6px';
    inlineInput.style.marginLeft = '4px';
    inlineInput.style.width = '160px';

    function commitNewOption() {
      const custom = inlineInput.value.trim();
      inlineInput.style.display = 'none';
      if (custom && !options.includes(custom)) {
        options.push(custom);
        const labelEl = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = custom;
        checkbox.checked = true;
        checkbox.addEventListener('change', () => {
          const checkedVals = Array.from(dropdownContent.querySelectorAll('input[type=checkbox]:checked'))
            .map(cb => cb.value);
          eventData[eventIds[currentIndex]][id] = checkedVals;
          updateButtonText();
          saveToLocalStorage();
        });
        labelEl.appendChild(checkbox);
        labelEl.appendChild(document.createTextNode(' ' + custom));
        dropdownContent.appendChild(labelEl);
        const vals = eventData[eventIds[currentIndex]][id] || [];
        vals.push(custom);
        eventData[eventIds[currentIndex]][id] = vals;
        updateButtonText();
        saveToLocalStorage();
      }
    }

    inlineInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commitNewOption(); }
      if (e.key === 'Escape') { inlineInput.style.display = 'none'; }
    });
    const row = document.createElement('div');
    row.className = 'inline';
    row.appendChild(dropdown);
    row.appendChild(addBtn);
    row.appendChild(inlineInput);
    container.appendChild(row);
  }

  function updateButtonText() {
    const vals = eventData[eventIds[currentIndex]][id] || [];
    if (vals.length === 0) {
      btn.textContent = '-- Select --';
    } else if (vals.length <= 3) {
      btn.textContent = vals.join(', ');
    } else {
      btn.textContent = vals.length + ' selected';
    }
  }

  return container;
}

function parseEventIds(input) {
  try {
    const obj = JSON.parse(input);
    return obj.event_id?.$in || [];
  } catch { return []; }
}

function inferClasses(eventType, pii, pvz, pi, pib) {
  if (eventType === 'INTRUSION') {
    if (!pii) return { major: 'false positive', intermediary: 'ghost' };
    if (pvz && pi && pib) return { major: 'true positive', intermediary: 'in-bed detection' };
    if (pvz && !pi && pib) return { major: 'true positive', intermediary: 'out-of-bed detection' };
    if (pvz && pi && !pib) return { major: 'false positive', intermediary: 'happy accident' };
    if (pvz && !pi && !pib) return { major: 'false positive', intermediary: 'ghost' };
    if (!pvz && pi && !pib) return { major: 'false positive', intermediary: 'happy accident' };
    if (!pvz && !pi && !pib) return { major: 'false positive', intermediary: 'ghost' };
  } else if (eventType === 'LEARNING') {
    if (!pii) return { major: 'true negative', intermediary: 'empty' };
    if (pvz && pi) return { major: 'false negative', intermediary: 'missed detection' };
    if (pvz && !pi) return { major: 'false negative', intermediary: 'out-of-bed presence' };
    if (!pvz && pi) return { major: 'true negative', intermediary: 'non-visible intrusion' };
    if (!pvz && !pi) return { major: 'true negative', intermediary: 'out-of-bed presence' };
  }
  return { major: 'unknown', intermediary: 'unknown' };
}

function getCurrentState(id) {
  return eventData[eventIds[currentIndex]]?.[id];
}

function updateInferredDisplay() {
  const d = eventData[eventIds[currentIndex]] || {};
  const type = document.getElementById('globalEventTypeSelect').value;

  if (d.discard_criteria && d.discard_criteria !== '') {
    const majorSpan = document.getElementById('majorClass');
    majorSpan.textContent = 'discard';
    majorSpan.className = 'class-label major-discard';

    const interSpan = document.getElementById('intermediaryClass');
    interSpan.textContent = 'discard';
    interSpan.className = 'class-label intermediary-discard';

    return;
  }

  const result = inferClasses(type, d.person_in_image, d.person_visible_in_zone, d.person_intruding, d.person_in_bbox);

  const majorSpan = document.getElementById('majorClass');
  majorSpan.textContent = result.major;
  majorSpan.className = 'class-label major-' + result.major.replace(/ /g, '-');

  const interSpan = document.getElementById('intermediaryClass');
  interSpan.textContent = result.intermediary;
  interSpan.className = 'class-label intermediary-' + result.intermediary.replace(/ /g, '-');
}

function validateRequiredFields() {
  const d = eventData[eventIds[currentIndex]];
  const eventType = document.getElementById('globalEventTypeSelect').value;

  if (d.discard_criteria && d.discard_criteria !== '') return true;

  const requiredFields = ['environment'];

  // Add conditionally required fields
  if (d.person_in_image && !d.person_intruding) {
    requiredFields.push('body_position');
  }
  if (d.body_position === 'interacting with vehicle') {
    requiredFields.push('interaction_type');
  }
  if (d.person_intruding) {
    requiredFields.push('body_part_in_bed', 'intruding_from');
  }
  if (d.person_intruding && !d.person_visible_in_zone) {
    requiredFields.push('person_obstructed_by');
  }

  // Only apply this for INTRUSION events
  if (eventType === 'INTRUSION' && d.person_in_bbox === false) {
    requiredFields.push('fp_cause');
  }

  // FN Cause is required whenever a LEARNING event is inferred as false negative
  // (either "missed detection" when person_intruding=true, or "out-of-bed presence"
  // when person_intruding=false but the person is visible in the zone).
  if (
    eventType === 'LEARNING' &&
    d.person_in_image && d.person_visible_in_zone
  ) {
    requiredFields.push('fn_cause');
  }

  // Check if any required field is empty or undefined
  return requiredFields.every(f => d[f] !== undefined && d[f] !== '');
}



function exportCsv() {
  const type = document.getElementById('globalEventTypeSelect').value;
  if (!type) {
    alert('Please select a global event type.');
    return;
  }

  const headers = [
    'event_id',
    'event_type',
    'person_in_image',
    'person_visible_in_zone',
    'person_intruding',
    'person_in_bbox',
    'discard_criteria',
    'environment',
    'non_person_movement',
    'out_of_snapshot_activity',
    'body_position',
    'interaction_type',
    'body_part_in_bed',
    'intruding_from',
    'person_obstructed_by',
    'fp_cause',
    'fn_cause',
    'major_class',
    'intermediary_class'
  ];

  const rows = [headers.join(',')];

  for (const id of eventIds) {
    const d = eventData[id] || {};
    const hasDiscard = d.discard_criteria && d.discard_criteria !== '';
    const inferred = hasDiscard
      ? { major: 'discard', intermediary: 'discard' }
      : inferClasses(type, d.person_in_image, d.person_visible_in_zone, d.person_intruding, d.person_in_bbox);

    const row = [
      id,
      type,
      d.person_in_image ?? '',
      d.person_visible_in_zone ?? '',
      d.person_intruding ?? '',
      d.person_in_bbox ?? '',
      d.discard_criteria ?? '',
      d.environment ?? '',
      Array.isArray(d.non_person_movement) ? d.non_person_movement.join('; ') : (d.non_person_movement || ''),
      d.out_of_snapshot_activity ?? '',
      d.body_position ?? '',
      d.interaction_type ?? '',
      d.body_part_in_bed ?? '',
      d.intruding_from ?? '',
      d.person_obstructed_by ?? '',
      d.fp_cause ?? '',
      d.fn_cause ?? '',
      inferred.major,
      inferred.intermediary
    ];

    rows.push(row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
  }

  const csv = rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'event_classifications.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function makeEnvironmentButtons() {
  // Shared subtypes come first (in the same order across rows); outside-only
  // subtypes and the "unknown, low light" option follow in the outside row.
  const outside = [
    'outside, car park', 'outside, residential', 'outside, industrial',
    'outside, street parking', 'outside, rural',
    'unknown, low light'
  ];
  const inside = [
    'inside, car park', 'inside, residential', 'inside, industrial'
  ];

  const current = eventData[eventIds[currentIndex]]?.environment || '';

  const container = document.createElement('div');
  container.style.marginTop = '12px';

  const lbl = document.createElement('label');
  lbl.textContent = 'Environment *';
  container.appendChild(lbl);

  function makeRow(options) {
    const row = document.createElement('div');
    row.className = 'env-btn-group';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'env-btn' + (opt === current ? ' selected' : '');
      btn.textContent = opt.replace(/^(outside|inside|unknown), /, '');
      btn.title = opt;
      btn.onclick = () => {
        eventData[eventIds[currentIndex]].environment = opt;
        saveToLocalStorage();
        renderForm();
      };
      row.appendChild(btn);
    });
    return row;
  }

  const outsideLabel = document.createElement('span');
  outsideLabel.className = 'env-row-label';
  outsideLabel.textContent = 'Outside';
  container.appendChild(outsideLabel);
  container.appendChild(makeRow(outside));

  const insideLabel = document.createElement('span');
  insideLabel.className = 'env-row-label';
  insideLabel.textContent = 'Inside';
  container.appendChild(insideLabel);
  container.appendChild(makeRow(inside));

  return container;
}

function clearNonDiscardFields() {
  const d = eventData[eventIds[currentIndex]];
  for (const key in d) {
    if (key === 'discard_criteria') continue;
    if (Array.isArray(d[key])) d[key] = [];
    else if (typeof d[key] === 'boolean') d[key] = false;
    else d[key] = '';
  }
}

function makeDropdown(id, label, options, required = false, disabled = false, isAddable = false, multiple = false) {
  const div = document.createElement('div');
  const lbl = document.createElement('label');
  lbl.textContent = `${label}${required ? ' *' : ''}`;
  div.appendChild(lbl);

  const currentVal = getCurrentState(id);
  const optionList = [...options];

  if (Array.isArray(currentVal)) {
    currentVal.forEach(val => {
      if (!optionList.includes(val)) optionList.push(val);
    });
  } else if (currentVal && !optionList.includes(currentVal)) {
    optionList.push(currentVal);
  }

  if (multiple) {
    return makeMultiCheckboxDropdown(
      id,
      label,
      optionList,
      Array.isArray(currentVal) ? currentVal : [],
      isAddable
    );
  }

  const wrapper = document.createElement('div');
  wrapper.className = 'inline';

  const dropdown = document.createElement('div');
  dropdown.className = 'dropdown' + (disabled ? ' disabled' : '');

  const btn = document.createElement('div');
  btn.className = 'dropdown-btn';
  btn.textContent = currentVal || '-- Select --';

  const dropdownContent = document.createElement('div');
  dropdownContent.className = 'dropdown-content';

  [['', '-- Select --'], ...optionList.map(o => [o, o])].forEach(([val, text]) => {
    const item = document.createElement('div');
    item.className = 'dropdown-item' + (val === currentVal ? ' selected' : '');
    item.textContent = text;
    item.addEventListener('click', () => {
      if (disabled) return;
      eventData[eventIds[currentIndex]][id] = val;
      if (id === 'discard_criteria' && val) {
        clearNonDiscardFields();
      }
      saveToLocalStorage();
      renderForm();
    });
    dropdownContent.appendChild(item);
  });

  dropdown.appendChild(btn);
  dropdown.appendChild(dropdownContent);
  wrapper.appendChild(dropdown);

  if (isAddable && !disabled) {
    const addBtn = document.createElement('button');
    addBtn.className = 'small-plus';
    addBtn.textContent = '+';
    addBtn.type = 'button';
    addBtn.onclick = () => {
      const custom = prompt(`Add new option for ${label}:`);
      if (custom) {
        eventData[eventIds[currentIndex]][id] = custom;
        saveToLocalStorage();
        renderForm();
      }
    };
    wrapper.appendChild(addBtn);
  }

  div.appendChild(wrapper);
  return div;
}

function makeCheckbox(id, label, dependsOn = null) {
  const d = eventData[eventIds[currentIndex]];
  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.id = id;
  checkbox.checked = !!d[id];

  checkbox.onchange = e => {
    eventData[eventIds[currentIndex]][id] = e.target.checked;
    saveToLocalStorage();
    renderForm();
  };

  const wrapper = document.createElement('div');
  wrapper.className = dependsOn === false ? 'disabled' : '';
  wrapper.appendChild(checkbox);
  wrapper.appendChild(document.createTextNode(' ' + label));
  checkbox.disabled = dependsOn === false;
  return wrapper;
}

function renderForm() {
  const id = eventIds[currentIndex];
  if (!eventData[id]) eventData[id] = {};
  const d = eventData[id];
  const type = document.getElementById('globalEventTypeSelect').value;

  if (type && d.person_in_image === undefined) {
    const defaultBool = (type === 'INTRUSION');
    d.person_in_image = defaultBool;
    d.person_visible_in_zone = defaultBool;
    d.person_intruding = defaultBool;
    d.person_in_bbox = defaultBool;
  }

  document.getElementById('eventIdDisplay').textContent = `Event ${currentIndex + 1} of ${eventIds.length}: ${id}`;
  const container = document.getElementById('formContainer');
  container.innerHTML = '';

  const pi = d.person_in_image;
  const pvz = d.person_visible_in_zone;
  const piBool = d.person_intruding;
  const pib = d.person_in_bbox;

  // Environment — always-visible button rows
  container.appendChild(makeEnvironmentButtons());

  // Person in Image Checkbox
  container.appendChild(makeCheckbox('person_in_image', 'Person in image'));
  container.appendChild(makeCheckbox('person_visible_in_zone', 'Person visible in zone', pi));
  container.appendChild(makeCheckbox('person_intruding', 'Person intruding', pi));
  container.appendChild(makeCheckbox('person_in_bbox', 'Person in bounding box', pi && type === 'INTRUSION'));

  // Conditional dropdowns based on current state

  if (pi && !piBool) {
    if (conditionalDropdowns['person_in_image==true && person_intruding==false']['body_position']) {
      container.appendChild(makeDropdown('body_position', 'Body Position', conditionalDropdowns['person_in_image==true && person_intruding==false']['body_position'], true));
    }
  }

  if (d.body_position === 'interacting with vehicle') {
    container.appendChild(makeDropdown('interaction_type', 'Interaction Type', conditionalDropdowns['body_position==interacting with vehicle']['interaction_type'], true));
  }

  if (piBool) {
    container.appendChild(makeDropdown('body_part_in_bed', 'Body Part in Bed', conditionalDropdowns['person_intruding==true']['body_part_in_bed'], true));
    container.appendChild(makeDropdown('intruding_from', 'Intruding From', conditionalDropdowns['person_intruding==true']['intruding_from'], true));
  }

  if (!pvz && piBool) {
    container.appendChild(makeDropdown('person_obstructed_by', 'Person Obstructed By', conditionalDropdowns['person_visible_in_zone==false && person_intruding==true']['person_obstructed_by'], true));
  }

  if (!pib && type === 'INTRUSION') {
    container.appendChild(makeDropdown('fp_cause', 'FP Cause', conditionalDropdowns['person_in_bbox==false']['fp_cause'], true));
  }

  if (type === 'LEARNING' && pi && pvz) {
    container.appendChild(makeDropdown('fn_cause', 'FN Cause', conditionalDropdowns['major==false negative']['fn_cause'], true));
  }

  // Out-of-Snapshot Activity — LEARNING events only
  if (type === 'LEARNING') {
    container.appendChild(makeDropdown('out_of_snapshot_activity', 'Out-of-Snapshot Activity', ['walk-by', 'person in cabin', 'undetected interaction']));
  }

  // Non-Person Movement multi-checkbox dropdown
  container.appendChild(makeDropdown('non_person_movement', 'Non-Person Movement', optionalDropdowns.non_person_movement, false, false, true, true));

  // Discard criteria dropdown
  container.appendChild(makeDropdown('discard_criteria', 'Discard Criteria', discardCriteria));

  updateInferredDisplay();

  const nextBtn = document.getElementById('nextEventBtn');
  nextBtn.disabled = !validateRequiredFields();

  document.getElementById('shiftBranchLabel').textContent = `${currentIndex + 1} of ${eventIds.length} (${id})`;
}

let shiftUndoSnapshot = null;

function isClassified(id) {
  const d = eventData[id];
  return !!(d && (d.environment || d.discard_criteria));
}

function setOrDelete(id, value) {
  if (value === undefined) delete eventData[id];
  else eventData[id] = value;
}

// direction -1: annotations belong to the previous event id; +1: the next event id.
function shiftAnnotations(direction) {
  const start = currentIndex;
  const input = document.getElementById('shiftEndInput').value.trim();
  let end;
  if (input === '') {
    end = -1;
    for (let i = eventIds.length - 1; i >= 0; i--) {
      if (isClassified(eventIds[i])) { end = i; break; }
    }
  } else {
    end = parseInt(input, 10) - 1;
  }

  if (!Number.isInteger(end) || end < start || end >= eventIds.length) {
    alert(`"Through event #" must be between ${start + 1} and ${eventIds.length}.`);
    return;
  }
  if (direction < 0 && start === 0) {
    alert('There is no previous event to shift onto.');
    return;
  }
  if (direction > 0 && end === eventIds.length - 1) {
    alert('The last annotation would fall off the end of the list. Lower "Through event #".');
    return;
  }

  const overwrittenId = direction < 0 ? eventIds[start - 1] : eventIds[end + 1];
  const clearedId = direction < 0 ? eventIds[end] : eventIds[start];
  const count = end - start + 1;
  const dirText = direction < 0 ? 'PREVIOUS' : 'NEXT';
  let msg = `Shift annotations for events ${start + 1}-${end + 1} (${count}) onto the ${dirText} event id?\n\n` +
        `Event ${eventIds.indexOf(clearedId) + 1} will be left blank.`;
  if (isClassified(overwrittenId)) {
    msg += `\nEvent ${eventIds.indexOf(overwrittenId) + 1} already has an annotation and will be overwritten.`;
  }
  msg += '\n\nYou can undo this once.';
  if (!confirm(msg)) return;

  shiftUndoSnapshot = JSON.stringify(eventData);
  const src = eventIds.slice(start, end + 1).map(id => eventData[id]);
  const offset = direction < 0 ? start - 1 : start + 1;
  src.forEach((value, k) => setOrDelete(eventIds[offset + k], value));
  delete eventData[clearedId];

  document.getElementById('shiftUndoBtn').disabled = false;
  document.getElementById('shiftEndInput').value = '';
  saveToLocalStorage();
  renderForm();
}

function undoShift() {
  if (!shiftUndoSnapshot) return;
  eventData = JSON.parse(shiftUndoSnapshot);
  shiftUndoSnapshot = null;
  document.getElementById('shiftUndoBtn').disabled = true;
  saveToLocalStorage();
  renderForm();
}

document.getElementById('loadEventsBtn').onclick = () => {
  const input = document.getElementById('eventIdsInput').value;
  eventIds = parseEventIds(input);
  if (eventIds.length === 0) {
    alert('Please enter valid event IDs JSON.');
    return;
  }
  currentIndex = 0;
  document.getElementById('globalEventTypeWrapper').classList.remove('hidden');
  renderForm();
  document.getElementById('inferenceDisplay').classList.remove('hidden');
  document.getElementById('eventNavigator').classList.remove('hidden');
  document.getElementById('eventIdDisplay').textContent = '';
};

document.getElementById('globalEventTypeSelect').onchange = e => {
  const newType = e.target.value;
  if (newType) {
    // Reset boolean defaults for any event not yet classified
    for (const id of eventIds) {
      const d = eventData[id] || {};
      if (!d.environment && !d.discard_criteria) {
        delete d.person_in_image;
        delete d.person_visible_in_zone;
        delete d.person_intruding;
        delete d.person_in_bbox;
      }
    }
  }
  renderForm();
  updateInferredDisplay();
};

document.getElementById('prevEventBtn').onclick = () => {
  if (currentIndex > 0) {
    currentIndex--;
    renderForm();
    updateInferredDisplay();
  }
};

document.getElementById('nextEventBtn').onclick = () => {
  if (currentIndex < eventIds.length - 1) {
    currentIndex++;
    renderForm();
    updateInferredDisplay();
  }
};

document.getElementById('shiftPrevBtn').onclick = () => shiftAnnotations(-1);
document.getElementById('shiftNextBtn').onclick = () => shiftAnnotations(1);
document.getElementById('shiftUndoBtn').onclick = undoShift;

document.getElementById('exportCsvBtn').onclick = exportCsv;

document.getElementById('clearSavedBtn').onclick = () => {
  if (confirm('Are you sure you want to clear all saved data? This cannot be undone.')) {
    clearLocalStorage();
    eventIds = [];
    currentIndex = 0;
    eventData = {};
    document.getElementById('eventIdsInput').value = '';
    document.getElementById('globalEventTypeWrapper').classList.add('hidden');
    document.getElementById('inferenceDisplay').classList.add('hidden');
    document.getElementById('eventNavigator').classList.add('hidden');
    document.getElementById('formContainer').innerHTML = '';
  }
};

// Check for saved data on page load
window.addEventListener('DOMContentLoaded', () => {
  const saved = loadFromLocalStorage();
  if (saved) {
    const eventsClassified = Object.keys(saved.eventData).filter(id => 
      saved.eventData[id].environment || saved.eventData[id].discard_criteria
    ).length;
    const msg = `Found saved session with ${saved.eventIds.length} events (${eventsClassified} classified).\n\nDo you want to restore it?`;
    if (confirm(msg)) {
      eventIds = saved.eventIds;
      currentIndex = saved.currentIndex;
      eventData = saved.eventData;
      document.getElementById('eventIdsInput').value = JSON.stringify({event_id: {$in: eventIds}});
      document.getElementById('globalEventTypeWrapper').classList.remove('hidden');
      document.getElementById('globalEventTypeSelect').value = saved.globalEventType || '';
      document.getElementById('inferenceDisplay').classList.remove('hidden');
      document.getElementById('eventNavigator').classList.remove('hidden');
      renderForm();
      document.getElementById('savedIndicator').textContent = `Restored session at event ${currentIndex + 1} of ${eventIds.length}`;
    }
  }
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  // Don't trigger if user is typing in an input field
  const activeEl = document.activeElement;
  const isTyping = activeEl.tagName === 'TEXTAREA' || 
                   activeEl.tagName === 'INPUT' || 
                   activeEl.tagName === 'SELECT';
  
  if (isTyping) return;
  
  // Only work if events are loaded
  if (eventIds.length === 0) return;
  
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (currentIndex > 0) {
      currentIndex--;
      saveToLocalStorage();
      renderForm();
      updateInferredDisplay();
    }
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    if (!validateRequiredFields()) return;
    if (currentIndex < eventIds.length - 1) {
      currentIndex++;
      saveToLocalStorage();
      renderForm();
      updateInferredDisplay();
    }
  } else if (e.key === 'Home') {
    e.preventDefault();
    currentIndex = 0;
    saveToLocalStorage();
    renderForm();
    updateInferredDisplay();
  } else if (e.key === 'End') {
    e.preventDefault();
    if (!validateRequiredFields()) return;
    currentIndex = eventIds.length - 1;
    saveToLocalStorage();
    renderForm();
    updateInferredDisplay();
  }
});

</script>

</body>
</html>
